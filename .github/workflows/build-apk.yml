name: Build Mixtape Pro APK

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "ci-logs/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Build Play Store bundle (.aab, shrunk)
        id: bundle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            unset STORE_PASSWORD KEY_PASSWORD
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
          gradle :app:bundleRelease --no-daemon --console=plain 2>&1 | tee -a build.log
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Audio DSP unit tests
        id: dsptest
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests "com.example.StudioDspTest" --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Screen tests (large text) + screenshots
        id: uitest
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests "com.example.UiScreensTest" -Proborazzi.test.record=true --no-daemon --console=plain 2>&1 | tee ui-test.log

      - name: Publish screenshots to ci-logs branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p /tmp/shots && cp -r app/build/ui-shots/. /tmp/shots/ 2>/dev/null || true
          grep -E "UiScreensTest|FAILED|Exception|at com\.example" -A2 ui-test.log | head -n 150 > /tmp/ui-test-summary.txt || true
          cp app/build/test-results/testDebugUnitTest/TEST-com.example.UiScreensTest.xml /tmp/ui-test.xml 2>/dev/null || true
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          rm -rf ci-logs/ui-shots && mkdir -p ci-logs/ui-shots
          cp -r /tmp/shots/. ci-logs/ui-shots/ 2>/dev/null || true
          cp /tmp/ui-test-summary.txt ci-logs/ui-test-summary.txt; cp /tmp/ui-test.xml ci-logs/ui-test.xml 2>/dev/null || true
          echo "${GITHUB_SHA}" > ci-logs/ui-sha.txt
          git add -f ci-logs/ui-shots ci-logs/ui-test-summary.txt ci-logs/ui-sha.txt ci-logs/ui-test.xml 2>/dev/null || git add -f ci-logs
          git commit -qm "UI screenshots for ${GITHUB_SHA}" && git push -f origin ci-logs || true
          git checkout -q "${GITHUB_SHA}"

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -n 200 > errors.txt || true
          # Surface Kotlin errors as annotations
          grep -E "^e: file://" build.log | head -n 40 | while read -r line; do
            f=$(echo "$line" | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)#\1#')
            l=$(echo "$line" | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)#\2#')
            m=$(echo "$line" | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)#\4#')
            echo "::error file=$f,line=$l::$m"
          done
          # Publish the full log to the ci-logs branch so it can be read without the web UI
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp build.log /tmp/build.log; cp errors.txt /tmp/errors.txt
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . || true
          mkdir -p ci-logs
          cp /tmp/build.log ci-logs/build.log; cp /tmp/errors.txt ci-logs/errors.txt
          echo "${GITHUB_SHA}" > ci-logs/sha.txt
          git add -f ci-logs/build.log ci-logs/errors.txt ci-logs/sha.txt
          git commit -qm "CI log for ${GITHUB_SHA}" && git push -f origin ci-logs || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MixtapePro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK releases (permanent version + "latest")
        if: success() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="3.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "MixtapePro-v${VERSION}.apk"
          if [ "${{ steps.bundle.outputs.signed }}" = "yes" ]; then AAB="MixtapePro-v${VERSION}-playstore.aab"; else AAB="MixtapePro-v${VERSION}-playstore-UNSIGNED.aab"; fi
          cp app/build/outputs/bundle/release/app-release.aab "$AAB"
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):')
          # 1) A permanent, numbered release for this exact build (never overwritten)
          gh release create "v${VERSION}" "MixtapePro-v${VERSION}.apk" "$AAB" \
            --target "${GITHUB_SHA}" \
            --title "Mixtape Pro v${VERSION}" \
            --notes "${NOTES}" || true
          # 2) The moving "latest" download link
          cp "MixtapePro-v${VERSION}.apk" MixtapePro.apk
          gh release delete mixtape-pro-latest --yes --cleanup-tag || true
          gh release create mixtape-pro-latest MixtapePro.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Mixtape Pro (latest build) — v${VERSION}" \
            --notes "Always the newest build from main. Older versions are listed on the Releases page as v3.0.x."

  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Call the real art / lyrics / streaming APIs
        env:
          LIVE_API_CHECK: "1"
        run: |
          gradle :app:testDebugUnitTest --tests "com.example.LiveApiCheckTest" --no-daemon --console=plain -i 2>&1 | tee test.log || true
          grep -E "^\s*(ART|LYRICS|AUDIUS|ARCHIVE)" test.log > summary.txt || true
          cat app/build/api-check.txt 2>/dev/null >> summary.txt || true
      - name: Publish API report to ci-logs branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp summary.txt /tmp/api.txt 2>/dev/null || echo "no summary" > /tmp/api.txt
          tail -n 150 test.log > /tmp/api-test-tail.txt 2>/dev/null || true
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p ci-logs
          cp /tmp/api.txt ci-logs/api-check.txt; cp /tmp/api-test-tail.txt ci-logs/api-test-tail.txt || true
          echo "${GITHUB_SHA}" > ci-logs/api-sha.txt
          git add -f ci-logs/api-check.txt ci-logs/api-test-tail.txt ci-logs/api-sha.txt
          git commit -qm "API check for ${GITHUB_SHA}" && git push -f origin ci-logs || true
